<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090C12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DC23 Studio" />
  <title>DC23 Studio — Điều hành 23 kênh</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=3" />
</head>
<body>
  <!-- Lock Screen -->
  <section id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-brand">
        <img src="./icon-192.png" alt="DC23" class="lock-logo" />
        <div>
          <h1>DC23 Studio</h1>
          <p class="lock-sub">Điều hành 23 kênh • Mã hoá AES-256</p>
        </div>
      </div>

      <div id="lock-meta" class="lock-meta">Đang kiểm tra bản cập nhật...</div>

      <form id="unlock-form" class="unlock-form" autocomplete="on">
        <label for="pin-input" class="input-label">Mã PIN truy cập</label>
        <div class="pin-wrap">
          <input
            id="pin-input"
            type="password"
            placeholder="Nhập mã PIN (vd: DC23-...)"
            autocomplete="current-password"
            autocapitalize="characters"
            spellcheck="false"
            required
          />
          <button type="button" id="toggle-pin" class="icon-btn" aria-label="Hiện/ẩn mã PIN">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="remember-pin" checked />
          <span>Ghi nhớ trên điện thoại này</span>
        </label>

        <div id="lock-error" class="lock-error" hidden></div>

        <button type="submit" id="unlock-btn" class="primary-btn">
          Mở khoá bảng điều hành
        </button>
      </form>
    </div>
  </section>

  <!-- Main Authenticated App Shell -->
  <div id="app-shell" class="app-shell" hidden>
    <header class="app-header">
      <div class="header-left">
        <img src="./icon-192.png" alt="DC23" class="header-logo" />
        <div>
          <div class="header-title-row">
            <span class="header-title">DC23 Studio</span>
            <span id="health-pill" class="health-pill">—</span>
          </div>
          <div id="header-updated" class="header-sub">—</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-refresh" class="icon-btn" title="Tải lại dữ liệu mới nhất" aria-label="Tải lại">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6"/>
            <path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button type="button" id="btn-lock" class="icon-btn" title="Khoá & xoá PIN đã lưu" aria-label="Khoá ứng dụng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="main-content" class="main-content">
      <section id="tab-overview" class="tab-panel active"></section>
      <section id="tab-channels" class="tab-panel" hidden></section>
      <section id="tab-comments" class="tab-panel" hidden></section>
      <section id="tab-schedule" class="tab-panel" hidden></section>
    </main>

    <nav class="bottom-nav" aria-label="Điều hướng chính">
      <button type="button" class="nav-btn active" data-tab="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Tổng quan</span>
      </button>
      <button type="button" class="nav-btn" data-tab="channels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>23 Kênh</span>
      </button>
      <button type="button" class="nav-btn" data-tab="comments">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span id="badge-comments" class="nav-badge" hidden></span>
        </span>
        <span>Bình luận</span>
      </button>
      <button type="button" class="nav-btn" data-tab="schedule">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span id="badge-schedule" class="nav-badge" hidden></span>
        </span>
        <span>Lịch &amp; A/B</span>
      </button>
    </nav>
  </div>

  <!-- Channel Detail Slide-up Modal -->
  <div id="channel-modal" class="modal-overlay" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div>
          <div id="modal-badges" class="modal-badges"></div>
          <h2 id="modal-title"></h2>
        </div>
        <button type="button" id="modal-close" class="icon-btn" aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="./app.js?v=3"></script>
</body>
</html>
